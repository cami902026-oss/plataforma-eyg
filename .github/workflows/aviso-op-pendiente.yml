name: 📑 Avisos automáticos (OP pendiente + cotización en revisión)

on:
  schedule:
    # Cada 15 minutos entre las 6 AM y las 10 PM Colombia (11:00–03:00 UTC).
    # La primera versión cortaba a las 7 PM "para no despertar a nadie" y el
    # 23-ago se mandó una OP a las 8:44 PM que se quedó esperando hasta el día
    # siguiente. El equipo trabaja de noche; el aviso tiene que estar ahí.
    # Sin restricción de día: en UTC el viernes por la noche ya es sábado.
    - cron: '*/15 11-23 * * *'
    - cron: '*/15 0-3 * * *'
  workflow_dispatch:

# Que dos corridas no se pisen: si una se demora, la siguiente espera.
concurrency:
  group: aviso-op-pendiente
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    name: 📧 Avisar a quien le toca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📧 Revisar y avisar
        env:
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          # Escritura del evento 'aviso_enviado': necesita la key con permiso
          # de escritura. Si solo hay lectura, el aviso sale igual pero se
          # repetiría; por eso se usa la secreta.
          SUPABASE_KEY:     ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_KEY }}
          REMITENTE_OP:     'info@eygenergygroup.com'
        run: python scripts/aviso_op_pendiente.py

      # 👔 Cotizaciones que pasaron a "Revisión gerencia". Va en el MISMO
      # workflow a propósito: la lista blanca del proxy (energy-proxy.gs) solo
      # deja disparar este archivo, así que colgando el aviso aquí funciona el
      # disparo instantáneo desde la plataforma sin tocar Apps Script.
      # `always()` para que un fallo del aviso de OP no se lleve este.
      #
      # 28-ago-2026 — SOLO en el disparo instantáneo, nunca en el barrido de
      # cada 15 minutos. El respaldo por schedule se volvió en contra: su
      # anti-duplicado vive en data/aviso_gerencia_estado.json y se guarda con
      # `git push`, que viene fallando desde el 25-ago porque el equipo empuja
      # commits al repo todo el día. Sin poder marcar «ya avisé», cada corrida
      # volvía a avisar: 3 cotizaciones (LM2055, LM2070, LM2049-1) × ~64
      # corridas diarias. El aviso de OP no sufre esto porque marca en Supabase.
      # Ahora sale una vez, cuando quien arma la cotización la manda a revisión.
      - name: 👔 Cotizaciones en revisión de gerencia
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_KEY }}
          REMITENTE_OP:     'info@eygenergygroup.com'
        run: python scripts/aviso_cotiz_gerencia.py

      # El estado vive en el repo (no en Supabase) porque no hay tabla de
      # eventos de cotizaciones. Sin esto, cada corrida volvería a avisar.
      - name: 💾 Guardar qué cotizaciones ya se avisaron
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "ENERGY Bot"
          git config user.email "bot@eygenergygroup.com"
          git add data/aviso_gerencia_estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "👔 Aviso de revisión de gerencia - $(TZ='America/Bogota' date +'%Y-%m-%d %H:%M')"
            # Reintentos: los navegadores del equipo empujan data/ todo el día
            for i in 1 2 3; do
              git push && break
              git pull --rebase && sleep 3
            done
          fi
