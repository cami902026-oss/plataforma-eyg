name: 📑 Avisos automáticos (OP pendiente + cotización en revisión)

on:
  schedule:
    # Cada 15 minutos entre las 6 AM y las 10 PM Colombia (11:00–03:00 UTC).
    # La primera versión cortaba a las 7 PM "para no despertar a nadie" y el
    # 23-ago se mandó una OP a las 8:44 PM que se quedó esperando hasta el día
    # siguiente. El equipo trabaja de noche; el aviso tiene que estar ahí.
    # Sin restricción de día: en UTC el viernes por la noche ya es sábado.
    - cron: '*/15 11-23 * * *'
    - cron: '*/15 0-3 * * *'
  workflow_dispatch:

# Que dos corridas no se pisen: si una se demora, la siguiente espera.
concurrency:
  group: aviso-op-pendiente
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    name: 📧 Avisar a quien le toca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📧 Revisar y avisar
        env:
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          # Escritura del evento 'aviso_enviado': necesita la key con permiso
          # de escritura. Si solo hay lectura, el aviso sale igual pero se
          # repetiría; por eso se usa la secreta.
          SUPABASE_KEY:     ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_KEY }}
          REMITENTE_OP:     'info@eygenergygroup.com'
        run: python scripts/aviso_op_pendiente.py

      # 👔 Cotizaciones que pasaron a "Revisión gerencia". Va en el MISMO
      # workflow a propósito: la lista blanca del proxy (energy-proxy.gs) solo
      # deja disparar este archivo, así que colgando el aviso aquí funciona el
      # disparo instantáneo desde la plataforma sin tocar Apps Script.
      # `always()` para que un fallo del aviso de OP no se lleve este.
      #
      # 28-ago-2026 — quedó SOLO en disparo instantáneo porque su anti-duplicado
      # vivía en data/aviso_gerencia_estado.json, guardado con `git push`, y ese
      # push venía fallando desde el 25-ago (el equipo empuja commits todo el
      # día). Sin poder marcar «ya avisé», cada corrida repetía: LM2055, LM2070
      # y LM2049-1 × ~64 corridas diarias.
      # 29-ago-2026 — la memoria pasó a Supabase (tabla `avisos_enviados`, con
      # índice único por tipo+clave), así que el barrido de respaldo VUELVE: si
      # el disparo instantáneo falla, el aviso sale igual en el siguiente ciclo
      # y no se repite. Es lo que se había perdido al apagarlo.
      - name: 👔 Cotizaciones en revisión de gerencia
        if: always()
        env:
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_KEY }}
          REMITENTE_OP:     'info@eygenergygroup.com'
        run: python scripts/aviso_cotiz_gerencia.py

      # 29-ago-2026 — Se eliminó el paso «💾 Guardar qué cotizaciones ya se
      # avisaron», que commiteaba data/aviso_gerencia_estado.json y lo empujaba
      # al repo. Ese push competía con los commits del equipo, fallaba, y al
      # fallar el aviso se repetía todo el día. La memoria ahora vive en la
      # tabla `avisos_enviados` de Supabase y el propio script la escribe: no
      # hace falta commitear nada.
